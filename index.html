<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚖️ Debate Académico - Moderador IA</title>
<style>
/* ESTILOS OMITIDOS POR ESPACIO (puedes mantener los tuyos anteriores) */
body{font-family:'Poppins',sans-serif;background:#f7f8fb;margin:0;display:flex;justify-content:center;align-items:center;height:100vh;}
.chat-container{width:95%;max-width:780px;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);display:flex;flex-direction:column;height:90vh;overflow:hidden;}
.chat-header{background:#3b4cc0;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-weight:600;}
.chat-messages{flex:1;padding:15px;overflow-y:auto;background:#f1f3f9;}
.message-bubble{margin:8px 0;padding:12px 16px;border-radius:14px;max-width:75%;}
.user{align-self:flex-end;background:#dcfce7;}
.opponent{align-self:flex-start;background:#e8edff;}
.moderator{align-self:center;background:#f3f4f6;text-align:center;font-style:italic;}
.chat-input{display:flex;padding:12px;border-top:1px solid #ddd;}
.chat-input input{flex:1;padding:10px;border-radius:20px;border:1px solid #ccc;}
.chat-input button{background:#3b4cc0;color:#fff;border:none;border-radius:50%;width:42px;height:42px;margin-left:10px;cursor:pointer;}
</style>
</head>
<body>

<div class="chat-container" id="chat-container">
  <div class="chat-header">
    <span>💬 Debate Académico | <span id="debate-topic">Pendiente</span></span>
    <div><span id="turn-counter">Turno: 0 / 10</span> <span id="timer">10:00</span></div>
  </div>
  <div class="chat-messages" id="chat-messages">
    <div class="message-bubble moderator"><b>Moderador:</b> Oprime <b>Iniciar</b> para configurar el debate virtual.</div>
  </div>
  <div class="chat-input">
    <input type="text" id="message-input" placeholder="Escribe tu argumento..." disabled>
    <button id="send-btn" disabled>✈️</button>
  </div>
</div>

<script>
const messageInput=document.getElementById("message-input");
const sendBtn=document.getElementById("send-btn");
const chatMessages=document.getElementById("chat-messages");
const turnCounter=document.getElementById("turn-counter");
const timerDisplay=document.getElementById("timer");
let debateTopic="Marihuana Legal",studentRole="En contra",opponentRole="A favor",difficulty="Medio";
let turnCount=0,totalSeconds=600;

function addMessage(sender,content,type){
  const div=document.createElement("div");
  div.className=`message-bubble ${type}`;
  div.innerHTML=`<b>${sender}:</b> ${content}`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop=chatMessages.scrollHeight;
}

function getCleanHistory(){
  return Array.from(chatMessages.children).map(el=>({
    sender:el.classList.contains("user")?"user":el.classList.contains("opponent")?"ia":"moderator",
    content:el.innerText
  }));
}

sendBtn.onclick=sendMessage;
messageInput.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage();});

async function sendMessage(){
  const msg=messageInput.value.trim();
  if(!msg)return;
  turnCount++;
  turnCounter.textContent=`Turno: ${turnCount} / 10`;
  addMessage(`Estudiante [${studentRole}]`,msg,"user");
  messageInput.value="";
  messageInput.disabled=true;
  sendBtn.disabled=true;

  try{
    const response=await fetch("https://TU_SERVIDOR_RENDER.onrender.com/api/debate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        topic:debateTopic+" | Nivel: "+difficulty,
        role:opponentRole,
        history:getCleanHistory(),
        lastArgument:msg
      }),
    });
    const data=await response.json();
    addMessage(`IA Oponente [${opponentRole}]`,data.response,"opponent");
  }catch(error){
    console.error(error);
    addMessage("Moderador","⚠️ Error al conectar con la IA. Verifica que el servidor esté activo.","moderator");
  }

  messageInput.disabled=false;
  sendBtn.disabled=false;
  if(++turnCount>=10)showVerdict();
}

async function showVerdict(){
  clearInterval(timer);
  addMessage("Moderador","🏁 Fin del debate. Analizando resultados...","moderator");
  try{
    const response=await fetch("https://TU_SERVIDOR_RENDER.onrender.com/api/judge_turn",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        topic:debateTopic,
        opponentRole,
        history:getCleanHistory()
      }),
    });
    const data=await response.json();
    addMessage("Moderador",data.verdict,"moderator");
  }catch(e){
    addMessage("Moderador","⚠️ Error al generar veredicto.","moderator");
  }
}
</script>
</body>
</html>
